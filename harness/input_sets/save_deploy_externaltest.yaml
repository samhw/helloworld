                        value: arn:aws:elasticloadbalancing:us-east-1:992588962742:listener/app/vis-vdis-int-prod-alb/36a7ee9f86636b66/ca4befe643bea746
                      - name: STAGE_LISTENER_RULE
                        type: String
                        value: arn:aws:elasticloadbalancing:us-east-1:992588962742:listener-rule/app/vis-vdis-int-prod-alb/36a7ee9f86636b66/ca4befe643bea746/468a1ba1b71a593e
                    steps:
                      - step:
                          identifier: EcsBlueGreenCreateService
                          type: EcsBlueGreenCreateService
                          spec:
                            loadBalancer: vis-vdis-int-prod-alb
      - stage:
          identifier: ECS_Kafka_Deploy
          type: Deployment
          spec:
            service:
              serviceInputs:
                serviceDefinition:
                  type: ECS
                  spec:
                    variables:
                      - name: IMAGE_TAG
                        type: String
                        value: ""
                      - name: APP_LOG_LEVEL
                        type: String
                        value: INFO
                      - name: TASK_ROLE_ARN
                        type: String
                        default: arn:aws:iam::992588962742:role/externaltest-savems20240611221346498100000004
                        value: arn:aws:iam::992588962742:role/externaltest-savems20240611221346498100000004
                      - name: CPU
                        type: String
                        value: "1024"
                      - name: MEMORY
                        type: String
                        value: "3000"
                      - name: TARGET_DEPLOY_ENV
                        type: String
                        value: externaltest
                      - name: TARGET_AWS_ACCOUNT
                        type: String
                        value: Prod
                      - name: NEW_RELIC_APP_NAME
                        type: String
                        value: externaltest-savems-extended-flow (prod)
                      - name: SERVICE_NAME
                        type: String
                        value: externaltest-savems-extended-flow
                      - name: DESIRED_COUNT
                        type: String
                        value: "3"
                      - name: MAXIMUM_PERCENT
                        type: String
                        value: "200"
                      - name: SPRING_DYNAMODB_ENDPOINT
                        type: String
                        value: https://dynamodb.us-east-1.amazonaws.com
                      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
                        type: String
