inputSet:
  name: save_deploy_externaltest
  tags: {}
  identifier: save_deploy_externaltest
  orgIdentifier: VIS
  projectIdentifier: VDIS
  pipeline:
    identifier: vdissavemicroservicedeployment
    stages:
      - stage:
          identifier: ECS_Deploy
          type: Deployment
          spec:
            service:
              serviceInputs:
                serviceDefinition:
                  type: ECS
                  spec:
                    variables:
                      - name: IMAGE_TAG
                        type: String
                        value: ""
                      - name: APP_LOG_LEVEL
                        type: String
                        value: INFO
                      - name: TASK_ROLE_ARN
                        type: String
                        default: arn:aws:iam::992588962742:role/externaltest-savems20240611221346498100000004
                        value: arn:aws:iam::992588962742:role/externaltest-savems20240611221346498100000004
                      - name: CPU
                        type: String
                        value: "1024"
                      - name: MEMORY
                        type: String
                        value: "3000"
                      - name: TARGET_DEPLOY_ENV
                        type: String
                        value: externaltest
                      - name: TARGET_AWS_ACCOUNT
                        type: String
                        value: Prod
                      - name: NEW_RELIC_APP_NAME
                        type: String
                        value: externaltest-savems (prod)
                      - name: SERVICE_NAME
                        type: String
                        value: externaltest-savems
                      - name: DESIRED_COUNT
                        type: String
                        value: "4"
            environment:
              environmentRef: Prod
              infrastructureDefinitions:
                - identifier: prod_cluster
            execution:
              steps:
                - stepGroup:
                    identifier: blueGreenDepoyment
                    variables:
                      - name: PROD_LISTENER
                        type: String
