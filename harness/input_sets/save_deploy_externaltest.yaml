                      - name: PROD_LISTENER_RULE
                        type: String
                        value: arn:aws:elasticloadbalancing:us-east-1:992588962742:listener-rule/app/vis-vdis-int-prod-alb/36a7ee9f86636b66/8f1e2c200065cc12/aa35a60ff04e0133
                      - name: STAGE_LISTENER
