    properties:
      ci:
        codebase:
          build:
            type: branch
            spec:
              branch: <+pipeline.branch>
    variables:
      - name: RUN_CI
        type: String
        value: "false"
      - name: DEPLOY_ENV
        type: String
        value: externaltest
      - name: DEPLOY_WEBHOOK_URL
        type: String
        value: https://default5e41ee740d2d4a728975998ce83205e.b.environment.api.gov.powerplatform.microsoft.us:443/powerautomate/automations/direct/workflows/a301ee27be1249c89764b012c8d2c1c6/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=BmswcmbBrnTdIQrIBIOkTAJtyIYvTqHuh5vqSQ7tjRA
      - name: DEPLOY_SAVEMS
        type: String
        value: "false"
      - name: DEPLOY_EXTENDED_FLOW
        type: String
        value: "false"
