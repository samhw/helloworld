                      - name: SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS
                        type: String
                        value: broker1.kafka-staging.uscis.dhs.gov:9093,broker2.kafka-staging.uscis.dhs.gov:9093,broker3.kafka-staging.uscis.dhs.gov:9093,broker4.kafka-staging.uscis.dhs.gov:9093,broker5.kafka-staging.uscis.dhs.gov:9093
                      - name: ADDITIONAL_PROFILE_TOGGLES
                        type: String
                        value: kafka-enabled
                      - name: AVAILABILITY_ZONE_REBALANCING
                        type: String
                        default: DISABLED
                        value: <+input>.default(DISABLED).allowedValues(DISABLED,ENABLED,null)
      - stage:
          identifier: Deployment_Marker
          type: CI
          spec:
            execution:
              steps:
                - step:
                    identifier: New_Relic_Deployment_Marker
                    template:
                      templateInputs:
                        type: Run
                        spec:
                          envVariables:
                            ENTITY_GUID: MTEyMTM1N3xBUE18QVBQTElDQVRJT058NTQ5MzUzODYx
                            APP_ENV: externaltest
      - stage:
          identifier: Keystore_Monitor
          type: CI
          variables:
            - name: DEPLOY_WEBHOOK_URL
              type: String
